[pytest]
testpaths = testcases
python_files = test_*.py
# -m "not allure_demo"：故意失败的演示用例（Day11 失败自动附加验证）默认不参与
# 全量运行，保证交付基线全绿；单独验证用：pytest -m allure_demo
addopts = -v --alluredir=./allure-results --clean-alluredir -m "not allure_demo"
markers =
    allure_demo: 故意失败的演示用例（验证失败自动附加），默认排除，用 pytest -m allure_demo 单独运行
    e2e: 端到端场景用例（Day12），覆盖核心业务流程完整链路（多接口串联），
        筛选运行用 pytest -m e2e / 排除用 pytest -m "not e2e"
